<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2d50bd">
    <meta name="description" content="Cadastro e edição de registros do sistema Sinistro Auto.">
    <title>Cadastro | Sinistro Auto</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@500;600&amp;display=swap">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="topbar"></header>
    <div class="context-bar"></div>

    <main class="content" id="conteudo" tabindex="-1">
      <div class="page-head">
        <div class="page-head__text">
          <span class="eyebrow" id="pagina-grupo">Cadastro</span>
          <h1 id="pagina-titulo">Cadastro</h1>
          <div class="muted" id="pagina-descricao"></div>
        </div>
        <div class="page-head__actions">
          <a class="btn" id="pagina-voltar" href="inicio.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-arrow-left"/></svg> Voltar para a lista</a>
        </div>
      </div>

      <form id="cadastro-form" novalidate>
        <div data-summary-anchor></div>
        <div class="stack" id="cadastro-secoes"></div>

        <div class="form-actions">
          <div class="btn-row">
            <button class="btn btn--danger" id="excluir" type="button" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-trash"/></svg> Excluir</button>
            <p>Campos com <span class="req">*</span> são obrigatórios.</p>
          </div>
          <div class="btn-row">
            <a class="btn" id="cancelar" href="inicio.html">Cancelar</a>
            <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-check"/></svg> Salvar</button>
          </div>
        </div>
      </form>
    </main>

    <footer class="app-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/data.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#2d50bd">
    <meta name="description" content="Parâmetros da distribuição automática da fila.">
    <title>Distribuição automática | Sinistro Auto</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@500;600&amp;display=swap">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="topbar"></header>
    <div class="context-bar"></div>

    <main class="content" id="conteudo" tabindex="-1">
      <div class="page-head">
        <div class="page-head__text">
          <span class="eyebrow">Gestão</span>
          <h1 id="pagina-titulo">Distribuição automática</h1>
          <p id="pagina-descricao">Defina quem atende cada natureza, em que ordem a fila anda e quanto tempo um processo pode ficar parado na caixa.</p>
        </div>
        <div class="page-head__actions"></div>
      </div>

      <form id="distribuicao-form" novalidate>
        <div data-summary-anchor></div>
        <div class="stack" id="distribuicao-secoes"></div>

        <div class="form-actions">
          <p id="distribuicao-alterado"></p>
          <div class="btn-row">
            <button class="btn" type="button" id="desfazer"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-undo"/></svg> Desfazer alterações</button>
            <button class="btn btn--primary" type="submit"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/icons.svg#i-check"/></svg> Salvar parâmetros</button>
          </div>
        </div>
      </form>
    </main>

    <footer class="app-footer"></footer>

    <script src="js/common.js"></script>
    <script src="js/data.js"></script>
    <script src="js/distribuicao.js"></script>
  </body>
</html>
